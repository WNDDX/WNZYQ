# 每天自动采集（北京时间 0 点）
#
# 为什么用 GitHub Actions：Cloudflare Pages Functions 只在有请求时运行，没有 Workers 的 cron。
# 这个工作流每天 UTC 16:00（= 北京 00:00）调一次站点的 /api/cron/collect。
#
# 使用前只需一步：仓库 Settings → Secrets and variables → Actions → New repository secret
#   名字：CRON_KEY      值：和 Cloudflare Pages 环境变量里的 CRON_KEY 一模一样
name: 每天自动采集

on:
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = 北京时间 00:00
  workflow_dispatch:        # 也可以在 Actions 页面手动点一下立刻跑

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 调采集接口
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          if [ -z "$CRON_KEY" ]; then
            echo "没有配置 CRON_KEY 这个 secret，跳过。"
            exit 0
          fi
          echo "开始调采集接口…"
          curl -fsS --max-time 300 "https://wnzyq.pages.dev/api/cron/collect?key=${CRON_KEY}" | head -c 4000
          echo
