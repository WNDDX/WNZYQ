<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>万能资源圈・资源</title>
  <meta name="description" content="万能资源圈・资源，优质虚拟资源分享平台，汇聚学习资源、软件工具、设计素材，展示与咨询客服获取。">
  <meta name="keywords" content="万能资源圈,资源导航,虚拟资源,学习资源,软件工具">
  <meta property="og:title" content="万能资源圈">
  <meta property="og:description" content="优质虚拟资源导航平台，一键获取学习资源、软件工具、设计素材">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="万能资源圈">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:image" content="/assets/images/logo.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="万能资源圈・资源">
  <meta name="twitter:description" content="优质虚拟资源分享平台，展示与咨询客服获取学习资源、软件工具、设计素材">
  <meta name="twitter:image" content="/assets/images/logo.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/ui-common.css">
  <script>if(window.location.protocol!=='file:'){var l=document.createElement('link');l.rel='manifest';l.href='/manifest.json';document.head.appendChild(l);}</script>
  <meta name="theme-color" content="#1E88E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151f" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="/assets/images/logo.png" as="image">
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="stylesheet" href="/assets/shop.css">
  <!-- R55：搜索引擎收录策略 -->
  <meta name="robots" content="index,follow">
  <!-- 资源页：允许收录（详情是弹窗无独立 URL，sitemap 只列 / 与 /shop） -->
</head>

<body>

  <!-- 下拉刷新提示 -->
  <div class="pull-refresh" id="pullRefresh">
    <div class="pull-refresh-text">
      <span class="pull-refresh-icon"></span>
      <span id="pullRefreshText">正在刷新...</span>
    </div>
  </div>

  <!-- ============ 顶部栏 ============ -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="shop-brand">
        <a class="shop-logo-link" href="admin" title="进入管理页" onclick="event.preventDefault();window.jumpTo(this.getAttribute('href'))">
          <img class="shop-logo" id="shopLogo" src="/assets/images/logo.png" alt="Logo" style="opacity:0" onload="this.style.opacity='1';var p=this.parentNode;p.style.background='#e2e5e9';p.style.opacity='1';if(p&&!p.classList.contains('logo-enter'))p.classList.add('logo-enter');" onerror="window.__logoFail&&window.__logoFail(this)" />
        </a>
        <div class="shop-name" id="shopName">万能资源圈・资源</div>
      </div>
      <div class="topbar-actions">
        <button class="tab" id="topContact" title="咨询客服">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>咨询客服</span>
        </button>
        <button class="tab" id="topShare" title="分享本页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span>分享</span>
        </button>
      </div>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input class="search-input" id="searchInput" placeholder="搜索资源" />
        <button class="search-clear" id="searchClear" title="清空">×</button>
      </div>
      <!-- 视图切换按钮（公共 .view-btn，R8 统一配色：激活淡白底、未激活淡蓝底，与管理页完全同色） -->
      <div class="view-toggle on-blue">
        <button type="button" class="view-btn active" id="viewListBtn" title="列表视图">☰ <span>列表</span></button>
        <button type="button" class="view-btn" id="viewGridBtn" title="网格视图">▦ <span>网格</span></button>


      </div>
    </div>
  </header>

  <!-- ============ 分类栏（一级） ============ -->
  <div class="category-bar-wrap">
    <nav class="category-bar" id="categoryBar"></nav>
    <button class="cat-toggle" id="catToggle" title="展开/收起分类">
      <svg class="toggle-arrow" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
    </button>
  </div>

  <!-- ============ 二级分类栏（选中一级分类且有子分类时显示） ============ -->
  <div class="sub-category-bar-wrap" id="subCatWrap" style="display:none;">
    <nav class="sub-category-bar" id="subCategoryBar"></nav>
    <button class="sub-cat-toggle" id="subCatToggle" title="展开/收起二级分类">
      <svg class="toggle-arrow" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
    </button>
  </div>

  <!-- ============ 平台公告弹窗（管理页可编辑，富文本，支持多条公告小项切换） ============ -->
  <div class="modal-mask ann-modal" id="annModal" onclick="if(event.target===this){closeAnnModal()}">
    <div class="ann-box" onclick="event.stopPropagation()">
      <button class="modal-close-x" id="annCloseX" type="button" onclick="closeAnnModal()">×</button>
      <button type="button" class="ann-title" id="annTitleTab" style="text-align:center;" onclick="showAnnDefault()">公告</button>
      <div class="ann-tabs" id="annTabs"></div>
      <div class="ann-body" id="annBody"></div>
      <button type="button" class="ann-ok" onclick="closeAnnModal()">确定</button>
    </div>
  </div>

  <!-- ============ 资源网格 ============ -->
  <!-- R55：骨架屏——数据加载前占位（与真实卡片同排版），renderProducts 首次渲染时自动替换；搜索/切分类是在数据已就位后过滤，不会重新出现骨架 -->
  <main class="product-grid" id="productGrid">
    <div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line w70"></div><div class="sk-line w95"></div></div>
    <div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line w55"></div><div class="sk-line w90"></div></div>
    <div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line w80"></div><div class="sk-line w65"></div></div>
    <div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line w62"></div><div class="sk-line w88"></div></div>
    <div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line w75"></div><div class="sk-line w92"></div></div>
    <div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line w58"></div><div class="sk-line w85"></div></div>
    <div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line w78"></div><div class="sk-line w60"></div></div>
    <div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line w66"></div><div class="sk-line w93"></div></div>
    <div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line w72"></div><div class="sk-line w87"></div></div>
    <div class="sk-card" aria-hidden="true"><div class="sk-img"></div><div class="sk-line w52"></div><div class="sk-line w91"></div></div>
  </main>
  <div class="empty-tip" id="emptyTip">
    <div class="empty-icon">📦</div>
    <div class="empty-title" id="emptyTitle">暂无资源</div>
    <div class="empty-desc" id="emptyDesc">该分类下暂无资源，看看其他分类吧</div>
  </div>

  <!-- ============ 详情弹窗 ============ -->
  <div class="modal-mask" id="modalMask">
    <div class="modal-wrap">
      <button class="modal-close-x" id="modalCloseX">×</button>
      <!-- R10 资源分享键（左上角，与×成对角）：转发样式图标，淡蓝底蓝图标，悬停蓝底白图标 -->
      <button class="modal-share-x" id="modalShareX" type="button" title="分享资源" aria-label="分享资源">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 17 20 12 15 7"></polyline>
          <path d="M4 18v-2a4 4 0 0 1 4-4h12"></path>
        </svg>
      </button>
      <div class="modal-box" id="modalBox">
        <img class="modal-cover" id="modalCover" alt="" />
        <div class="modal-content">
          <div class="modal-title-row">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-price" id="modalPrice"></div>
          </div>
          <div class="modal-desc" id="modalDesc"></div>
          <div class="modal-detail" id="modalDetail" style="display:none"></div>
          <div class="media-list" id="modalMedia"></div>
          <div class="variant-tabs" id="variantTabs" style="display:none"></div>
          <div class="variant-detail" id="variantDetail" style="display:none"></div>
          <!-- 专属内容解锁区域（有资源码则输入解锁，无资源码则直接查看） -->
          <div class="resource-code-section" id="resourceCodeSection" style="display:none">
            <div class="resource-code-header">
              <svg class="resource-code-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <span id="resourceCodeTitle">输入资源码获取专属内容</span>
            </div>
            <!-- 有资源码时：输入框+解锁按钮 -->
            <div class="resource-code-input-row" id="resourceCodeInputRow">
              <input type="text" class="resource-code-input" id="resourceCodeInput" placeholder="请输入资源码" />
              <button class="resource-code-btn" id="resourceCodeBtn">解锁</button>
            </div>
            <!-- 无资源码时：直接查看按钮 -->
            <div class="resource-direct-row" id="resourceDirectRow" style="display:none">
              <button class="resource-code-btn" id="resourceDirectBtn" style="width:100%">立即获取专属内容</button>
            </div>
            <div class="resource-code-error" id="resourceCodeError" style="display:none">资源码错误，请检查后重试</div>
            <div class="resource-content" id="resourceContent" style="display:none"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-contact" id="btnContact">咨询客服</button>
          <button class="btn-close-modal" id="btnCloseModal">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 分享提示弹窗 ============ -->
  <div class="share-mask" id="shareMask">
    <div class="share-box">
      <button class="modal-close-x" id="shareCloseX" type="button" onclick="closeShare()">×</button>      <div class="share-title">分享本站</div>
      <div class="share-tip">本站链接已复制到剪贴板</div>
      <div class="share-link" id="shareLinkText"></div>
      <button class="share-close" id="shareClose">确定</button>
    </div>
  </div>

  <!-- ============ 回到顶部按钮 ============ -->
  <button class="back-top" id="backTop" title="回到顶部">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <script>var SHOP_CONFIG = window.SHOP_CONFIG || { shopName: '万能资源圈', shopLogo: '/assets/images/logo.png', defaultContactUrl: '', categories: [{ id: 0, name: '全部', parent_id: 0 }], productList: [] };</script>
  <script>(function () { var s = document.createElement('script'); s.src = '/config.js'; s.onerror = function () {}; document.head.appendChild(s); })();</script>
  <script src="/assets/shop.js"></script>
  <!-- 图片/视频放大查看器 -->
  <!-- lightbox removed: use dynamic openLightbox/bindLightbox -->
  <script src="/assets/ui-common.js"></script>
  <script>
  (function () {
    function warn(t) { if (document.getElementById('__deployWarn')) return; var b = document.createElement('div'); b.id = '__deployWarn'; b.style.cssText = 'position:fixed;left:0;top:0;right:0;z-index:2147483647;background:#d32f2f;color:#fff;font:14px/1.6 sans-serif;padding:10px 14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.3)'; b.textContent = t; if (document.body) document.body.appendChild(b); document.addEventListener('DOMContentLoaded', function () { if (!b.parentNode && document.body) document.body.appendChild(b); }); }
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!window.__uiCommonLoaded) warn('公共脚本 assets/ui-common.js 未部署成功，统一功能失效：请把整个“万能资源圈”文件夹（含 assets、functions、sw.js、config.js）完整重新上传，不要只传 HTML');
        var ok = false; for (var i = 0; i < document.styleSheets.length; i++) { var s = document.styleSheets[i]; try { if (s.href && /ui-common\.css/.test(s.href) && s.cssRules && s.cssRules.length) ok = true; } catch (e) { if (s.href && /ui-common\.css/.test(s.href)) ok = true; } }
        if (!ok) warn('公共样式 assets/ui-common.css 未部署成功：请完整重新上传项目（含 assets 文件夹）');
      }, 800);
    });
  })();
  </script>
</body>
</html>
