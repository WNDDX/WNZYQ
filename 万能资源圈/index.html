.wrap{
    width: 100%;

    position: relative;
}
.logo-box{
    display: block;
    text-decoration: none;
    width: 100px; /* v405 条2：150→100 对齐错误页小版（老板拍板按小的那版为主） */
    height: 100px; /* v405 条2：同上 */

    margin: 0 auto;
    position: relative;
    overflow: hidden;
    opacity: 0; /* 进场前整体隐藏：边框/背景/图片同步进场 */
    /* v333 修：此处原本用 JS 的 // 注释，CSS 遇到 // 会一直丢弃到下一个分号，把下面那行 transition 一起吞掉（logo 按压/悬浮不再有过渡动画）。改成标准 CSS 注释后恢复正常 */
    /* v310（用户 10-05 14:25）：差异→统一口径。A1 logo 边框统一走 var(--card-bg) */
    border: 3px solid var(--card-bg); box-sizing: border-box; box-shadow: var(--avatar-shadow), 0 0 36px rgba(255,255,255,0.16);
    transition: transform var(--dur-fast) ease, box-shadow var(--dur-fast) ease; /* v400 条9：0.12s 散数改统一快档令牌 */

.logo-box:hover { box-shadow: 0 0 0 3px rgba(255,255,255,0.45); }
.logo-box:active { transform: scale(0.94) !important; opacity: 0.8 !important; }  /* R163：!important 压过 logoFadeIn forwards 填充（动画优先级高于普通声明，按压反馈此前被钉死的 scale(1) 遮蔽） */

    width: 100%;
    height: 100%;

}

}

/* 四色按钮（v327 用户拍板：导航页特殊页恢复原配色与字号，仅保留光斑背景等新增氛围效果） */

/**图片重试加载 */
function loadImg(imgDom, src, retryCount = 0) {
    // 同一地址已加载完成：直接显示，避免 opacity 卡 0
    if (imgDom.getAttribute('src') === src && imgDom.complete && imgDom.naturalWidth) { imgDom.style.display = 'block'; imgDom.style.opacity = '1'; return; } /* v402：kf-qr-in 分支随本地弹窗删除 */

        }else{
            imgDom.style.display = 'none';
            imgDom.onerror = null;
            imgDom.src = EXC_PH; if (imgDom.classList) imgDom.classList.add('media-fail');

    ph.style.cssText = 'width:100%;height:auto;display:block;';
    if (t.parentNode) t.parentNode.replaceChild(ph, t);
  }
}, true);

});

    function saveImg(src) {
      try {

          document.body.appendChild(a); a.click(); a.remove();

        }).catch(function () { tip('图片保存失败'); });
      } catch (e) { tip('图片保存失败'); }
    }
    cm.bind(document.body, 'img', function (img) {
      var src = img.currentSrc || img.src || '';
