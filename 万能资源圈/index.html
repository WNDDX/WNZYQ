<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>万能资源圈・导航</title>
<meta name="description" content="万能资源圈・导航，优质虚拟资源导航站，汇聚学习资源、软件工具、设计素材，一键获取。">
<meta name="keywords" content="万能资源圈,资源导航,虚拟资源,学习资源,软件工具">
<meta property="og:title" content="万能资源圈・导航">
<meta property="og:description" content="优质虚拟资源导航站，一键获取学习资源、软件工具、设计素材">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/images/logo.png">
<meta property="og:url" content="">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script>if(window.location.protocol!=='file:'){var l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l);}</script>
<meta name="theme-color" content="#1E88E5">
<link rel="preload" href="assets/images/logo.png" as="image">
<style>
:root{
    --blue1:#1E88E5;
    --blue2:#64B5F6;
    --blue3:#BBDEFB;
    --orange:#FF9900;
    --green:#01C000;
    --cyan:#008C8C;
    --red:#ff4444;
    --text:#222;
    --text-light:#666;
    --bg:#fff;
    --bg-light:#f3f4f6;
}
[data-theme="dark"]{
    --text:#eee;
    --text-light:#aaa;
    --bg:#1a1a2e;
    --bg-light:#2a2a3e;
}
*{
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
}
body{
    background: linear-gradient(180deg, var(--blue1) 0%, var(--blue2) 48%, var(--blue3) 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px 18px;
    cursor: pointer;
    animation: pageFadeIn 0.5s ease;
}
@keyframes pageFadeIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}
@keyframes logoFadeIn{
    from{opacity:0;transform:scale(0.8);}
    to{opacity:1;transform:scale(1);}
}
@keyframes breathe{
    0%,100%{opacity:0.6;}
    50%{opacity:1;}
}
.wrap{
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}
.logo-wrap{
    text-align: center;
    margin-bottom: 20px;
    position: relative;
}
.logo-box{
    width: 150px;
    height: 150px;
    border-radius: 50%;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    background: #e2e5e9;    border: 3px solid #fff; box-sizing: border-box; box-shadow: 0 0 0 2px rgba(255,255,255,0.3), 0 4px 14px rgba(30,80,140,0.22);
    animation: logoFadeIn 0.8s ease; transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.logo-box:hover { box-shadow: 0 0 0 3px rgba(255,255,255,0.45); }
.logo-box:active { transform: scale(0.9); opacity: 0.8; }
.logo-img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.logo-fail-icon{
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #888;
}
.page-title{
    color: #ffffff;
    font-size: 38px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 44px;
    opacity: 0.95;
    letter-spacing: 2.4px;
}
.btn-item{
    width: 100%;
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 20px;
    border: none;
    font-size: 26px;
    color: #ffffff;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    background: none;
    text-align: left;
    letter-spacing: 1.3px;
}
.modal-inner-btn{
    width: 80%;
    margin: 0 auto 14px;
    border-radius: 8px;
    padding: 11px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border: none;
    font-size: 18px;
    color: #ffffff;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    background-color: #01C000;
    letter-spacing: 0.9px;
}
.btn-orange{background-color: #FF9900;}
.btn-green{background-color: #01C000;}
.btn-blue{background-color: #1688FF;}
.btn-cyan{background-color: #008C8C;}
.icon-svg{
    width: 36px;
    height: 36px;
    flex-shrink: 0;
}
.modal-mask{
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.76);
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
}
.modal-box{
    background: #ffffff;
    border-radius: 14px;
    padding: 26px 22px;
    max-width: 480px;
    width: 100%;
    text-align: center;
}
.modal-title{
    font-size: 22px;
    color: #222222;
    margin-bottom: 16px;
    letter-spacing: 1.3px;
}
.qrcode-wrap{
    width: 250px;
    height: 250px;
    border: 1px solid #eee;
    margin: 0 auto 14px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    background: #f3f4f6;
}
.modal-qrcode{
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}
img[src^="data:image/svg+xml"]{display:block;width:100%;height:100%;object-fit:contain!important;object-position:center;background:#f5f5f5!important;}
.qrcode-fail-icon{
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #999;
}
.modal-tip{
    font-size: 16px;
    color: #666666;
    margin-bottom: 16px;
    letter-spacing: 0.9px;
}
.modal-close{
    background-color: #ff4444;
    color: #fff;
    border: none;
    padding: 11px 32px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    letter-spacing: 0.9px;
    user-select: none;
    -webkit-user-select: none;
}
/*按钮交互统一样式*/
.btn-item,.modal-inner-btn,.modal-close{
    transition: all 0.10s ease;
    -webkit-tap-highlight-color: transparent;
}
.btn-item:active,.modal-inner-btn:active,.modal-close:active{
    transform: scale(0.94);
    opacity: 0.8;
    filter: brightness(0.9);
}
.btn-item:hover,.modal-inner-btn:hover,.modal-close:hover{
    transform: scale(0.97);
    opacity: 0.9;
}
html,body{overscroll-behavior:none;}@media (hover:hover) and (pointer:fine){html,body{overscroll-behavior:auto;}}
.pull-refresh{position:fixed;top:0;left:0;right:0;height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;z-index:998;transition:height .2s ease;pointer-events:none;background:transparent;}
.pull-refresh.show{height:46px;}
.prt-text{font-size:12px;color:#fff;background:rgba(30,136,229,.92);border-radius:20px;padding:6px 16px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.18);}
.prt-icon{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.6);border-top-color:#fff;border-radius:50%;animation:prtspin .8s linear infinite;}
@keyframes prtspin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
    <div class="logo-wrap">
        <div class="logo-box">
            <img class="logo-img" id="logoImage" src="assets/images/logo.png" alt="">
            <div class="logo-fail-icon" id="logoFail">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
            </div>
        </div>
    </div>
    <div class="page-title">万能资源圈</div>

    <button class="btn-item btn-orange" onclick="openResource()">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="white">
            <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z" />
        </svg>
        <span>获取资源</span>
    </button>

    <button class="btn-item btn-green" onclick="openService()">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="white">
            <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 00.167-.054l1.903-1.114a.864.864 0 01.717-.098 10.16 10.16 0 002.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178A1.17 1.17 0 014.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178 1.17 1.17 0 01-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 01.598.082l1.584.926a.272.272 0 00.14.045c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 01-.023-.156.49.49 0 01.201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-7.062-6.122zm-2.036 2.87c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.983.97-.983zm4.844 0c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.983.969-.983z" />
        </svg>
        <span>咨询客服</span>
    </button>

    <button class="btn-item btn-blue" onclick="openGroup()">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="white">
            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        <span>交流群聊</span>
    </button>

    <button class="btn-item btn-cyan" onclick="openGzh()">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="white">
            <path d="M12 2A10 10 0 1 0 22 12 10 10 0 0 0 12 2zm0 18A8 8 0 1 1 20 12 8 8 0 0 1 12 20zm4.25-11.25a1 1 0 0 1-1.41 0l-1.84-1.84-1.84 1.84a1 1 0 0 1-1.41-1.41l1.84-1.84-1.84-1.84a1 1 0 0 1 1.41-1.41l1.84 1.84 1.84-1.84a1 1 0 0 1 1.41 1.41l-1.84 1.84 1.84 1.84a1 1 0 0 1 0 1.41z"/>
        </svg>
        <span>公众号讯</span>
    </button>
</div>

<div class="modal-mask" id="mask" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-title" id="modalTitle"></div>
        <div class="qrcode-wrap">
            <img class="modal-qrcode" id="modalImg" alt="">
            <div class="qrcode-fail-icon" id="qrFail">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
            </div>
        </div>
        <div class="modal-tip" id="modalTip"></div>
        <button class="modal-inner-btn" id="modalJumpBtn" style="display:none;"></button>
        <button class="modal-close" onclick="closeModal()">关闭</button>
    </div>
</div>

<script>
const CONFIG = {
    resourceUrl: "shop",
    serviceWeixinUrl: "https://work.weixin.qq.com/kfid/kfc39748ad948e8b691",
    groupWeixinUrl: "https://work.weixin.qq.com/gm/8036a2badd7daab25b1764b62c3bff9a",
    logoImg: "assets/images/logo.png",
    serviceQrImg: "assets/images/kefu.png",
    groupQrImg: "assets/images/qun.png",
    gzhImg: "assets/images/gzh.png",
    tipService: "长按图片识别-添加人工客服",
    tipGroup: "长按图片识别-加入交流群聊",
    tipGzh: "长按图片识别-关注公众号讯",
    maxRetry: 3,
    retryDelay: 1000
};
const dom = {
    mask: document.getElementById('mask'),
    modalTitle: document.getElementById('modalTitle'),
    modalImg: document.getElementById('modalImg'),
    modalTip: document.getElementById('modalTip'),
    qrFail: document.getElementById('qrFail'),
    logoImage: document.getElementById('logoImage'),
    logoFail: document.getElementById('logoFail'),
    modalJumpBtn: document.getElementById('modalJumpBtn')
};

// 全站统一：图片加载失败显示感叹号占位（与资源页/管理页/错误页一致）
var EXC_PH = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"%3E%3Crect width="24" height="24" fill="%23f5f5f5"/%3E%3Cpath d="M12 3.5 C 9.4 3.5, 8.3 5.6, 8.3 8.4 C 8.3 11.2, 9.6 13.1, 11 13.6 C 11.6 13.8, 12.4 13.8, 13 13.6 C 14.4 13.1, 15.7 11.2, 15.7 8.4 C 15.7 5.6, 14.6 3.5, 12 3.5 Z" fill="%23c3ccd6"/%3E%3Ccircle cx="12" cy="17.5" r="1.7" fill="%23c3ccd6"/%3E%3C/svg%3E';
/**图片重试加载 */
function loadImg(imgDom, src, retryCount = 0) {
    imgDom.onload = imgDom.onerror = null;
    imgDom.onload = () => {
        imgDom.style.display = 'block';
        imgDom === dom.logoImage ? dom.logoFail.style.display = 'none' : dom.qrFail.style.display = 'none';
    };
    imgDom.onerror = () => {
        const nextCount = retryCount + 1;
        if(nextCount < CONFIG.maxRetry){
            setTimeout(()=>loadImg(imgDom,src,nextCount),CONFIG.retryDelay);
        }else{
            imgDom.style.display = 'none';
            imgDom.onerror = null;
            imgDom.src = EXC_PH;
            imgDom.style.objectFit = 'contain';
            imgDom.style.display = 'block';
        }
    };
    imgDom.src = src;
}
loadImg(dom.logoImage, CONFIG.logoImg);

/**弹窗打开 */
function showModal(title, imgSrc, tipText, jumpUrl = null, btnText = null) {
    dom.modalTitle.textContent = title;
    dom.modalTip.textContent = tipText;
    dom.mask.style.display = 'flex';
    dom.modalImg.style.display = 'block';
    dom.qrFail.style.display = 'none';
    loadImg(dom.modalImg, imgSrc, 0);

    if(jumpUrl && btnText){
        dom.modalJumpBtn.style.display = 'flex';
        dom.modalJumpBtn.textContent = btnText;
        dom.modalJumpBtn.onclick = ()=>window.open(jumpUrl,"_blank");
    }else{
        dom.modalJumpBtn.style.display = 'none';
    }
}
function closeModal() {
    dom.mask.style.display = 'none';
    dom.modalJumpBtn.onclick = null;
}

// ESC 关闭弹窗
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && dom.mask.style.display === 'flex') {
        closeModal();
    }
});

// 暗色模式（跟随系统）
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
}

// PWA Service Worker 注册
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function(){});
    });
}

//页面按钮事件
function openResource() {window.location.href = CONFIG.resourceUrl;}
function openService() {showModal("咨询客服", CONFIG.serviceQrImg, CONFIG.tipService, CONFIG.serviceWeixinUrl, "跳转-咨询在线客服");}
function openGroup() {showModal("交流群聊", CONFIG.groupQrImg, CONFIG.tipGroup, CONFIG.groupWeixinUrl, "跳转-加入交流群聊");}
function openGzh() {showModal("公众号讯", CONFIG.gzhImg, CONFIG.tipGzh);}

// 下拉刷新（与资源页/管理页统一，顶部下拉即重载同步最新内容）
(function(){
    var tip=document.createElement('div');tip.className='pull-refresh';
    tip.innerHTML='<span class="prt-text"><span class="prt-icon"></span><span class="prt-label">下拉刷新</span></span>';
    document.body.appendChild(tip);
    var sy=0,sx=0,pulling=false,dist=0,TH=60;
    document.addEventListener('touchstart',function(e){
        if((window.scrollY||0)<=0){sy=e.touches[0].clientY;sx=e.touches[0].clientX;pulling=true;dist=0;}
    },{passive:true});
    document.addEventListener('touchmove',function(e){
        if(!pulling)return;
        var dy=e.touches[0].clientY-sy,dx=e.touches[0].clientX-sx;
        if(dy>0&&Math.abs(dy)>Math.abs(dx)){
            dist=Math.min(dy*0.5,80);tip.style.height=dist+'px';tip.classList.add('show');
            tip.querySelector('.prt-label').textContent=dist>TH?'释放立即刷新':'下拉刷新';
        }
    },{passive:true});
    document.addEventListener('touchend',function(){
        if(!pulling)return;pulling=false;
        if(dist>TH){tip.querySelector('.prt-label').textContent='正在刷新...';tip.style.height='46px';setTimeout(function(){try{loadImg(dom.logoImage,CONFIG.logoImg);}catch(e){}tip.classList.remove('show');tip.style.height='0';tip.querySelector('.prt-label').textContent='下拉刷新';},600);}
        else{tip.classList.remove('show');tip.style.height='0';}
        dist=0;
    },{passive:true});
})();
</script>
</body>
</html>
