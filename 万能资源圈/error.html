<script>
// 根据URL参数显示不同的错误信息
var params = new URLSearchParams(window.location.search);
var code = params.get('code') || '';
var errorMap = {
  '400': { title: '请求错误', desc: '你的请求格式不正确，请检查后重试' },
  '401': { title: '未授权访问', desc: '你没有权限访问此页面，请先登录' },
  '403': { title: '禁止访问', desc: '服务器拒绝了你的访问请求' },
  '404': { title: '页面访问异常', desc: '抱歉！您访问的页面出现了问题<br>①地址有误　②页面已删除　③服务暂不可用<br>可点击【导航页】或【资源页】继续浏览' },
  '500': { title: '服务器错误', desc: '服务器内部出现错误，请稍后重试' },
  '502': { title: '网关错误', desc: '服务器暂时不可用，请稍后重试' },
  '503': { title: '服务不可用', desc: '服务器正在维护中，请稍后重试' }
};
// 恢复错误码映射：404/500 等具体错误码显示对应的标题和说明（修复：原先被 if(false) 禁用，
// 任何错误都只显示通用内容，客户无法区分是地址错了还是服务器坏了）
if (code && errorMap[code]) {
  var info = errorMap[code];
  /* R19：不再显示错误码数字——所有错误都统一导向本错误页，大字固定「万能资源圈・错误」；错误标题和说明保留 */
  document.getElementById('errorTitle').textContent = info.title;
  document.getElementById('errorDesc').innerHTML = info.desc;
}
// 智能识别部署根：本站页面部署在「万能资源圈」子目录下，错误页可能从任意路径（含根级 /xxx）进入，
// 因此返回导航按钮与 logo 需根据当前路径自动计算正确地址，保证任何情况都能跳回导航页。
// R30-补全：错误页也挂全局媒体兜底——页面上任何图片/视频（含将来新增的）加载失败统一换感叹号占位，
// 与导航页/资源页/管理页同一套机制，做到全站四个页面全覆盖
document.addEventListener('error', function (e) {
  var t = e.target;
  if (!t || !t.tagName || t.dataset.fh) return;
  var EXC_PH = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"%3E%3Crect width="24" height="24" fill="%23f5f5f5"/%3E%3Cpath d="M12 3.5 C 9.4 3.5, 8.3 5.6, 8.3 8.4 C 8.3, 11.2, 9.6, 13.1, 11 13.6 C 11.6, 13.8, 12.4, 13.8, 13 13.6 C 14.4, 13.1, 15.7, 11.2, 15.7, 8.4 C 15.7, 5.6, 14.6, 3.5, 12 3.5 Z" fill="%23c3ccd6"/%3E%3Ccircle cx="12" cy="17.5" r="1.7" fill="%23c3ccd6"/%3E%3C/svg%3E';
  if (t.tagName === 'IMG') {
    t.dataset.fh = '1';
    t.src = EXC_PH; if (t.classList) t.classList.add('media-fail'); t.style.objectFit = 'contain'; t.style.display = 'block'; t.style.opacity = '1';
  } else if (t.tagName === 'VIDEO') {
    t.dataset.fh = '1';
    var ph = document.createElement('img');
    ph.src = EXC_PH; ph.classList.add('media-fail'); ph.style.cssText = 'width:100%;height:auto;display:block;';
    if (t.parentNode) t.parentNode.replaceChild(ph, t);
  }
}, true);
(function () {
  var logo = document.getElementById('errLogo');
  if (logo) {
    logo.src = '/assets/images/logo.png?v=224'; // 绝对路径，加载失败自动显示感叹号占位
    logo.onerror = function () { // 加载失败显示统一感叹号占位
      var _pp = this.parentNode; if (_pp) { _pp.style.opacity = '1'; if (!_pp.classList.contains('logo-enter')) _pp.classList.add('logo-enter'); }
      this.onerror = null;
      this.classList && this.classList.add('media-fail');
      this.src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"%3E%3Crect width="24" height="24" fill="%23f5f5f5"/%3E%3Cpath d="M12 3.5 C 9.4 3.5, 8.3 5.6, 8.3 8.4 C 8.3 11.2, 9.6 13.1, 11 13.6 C 11.6 13.8, 12.4 13.8, 13 13.6 C 14.4 13.1, 15.7 11.2, 15.7 8.4 C 15.7 5.6, 14.6 3.5, 12 3.5 Z" fill="%23c3ccd6"/%3E%3Ccircle cx="12" cy="17.5" r="1.7" fill="%23c3ccd6"/%3E%3C/svg%3E';
      this.style.objectFit = 'contain';
      this.style.display = 'block';
    };
  }
  var back = document.getElementById('errBack');
  var shopBtn = document.getElementById('errShop');
  // 导航页/资源页按钮：探测候选页面，取第一个能访问的（兼容根部署与子目录部署两种结构）
  // R50：资源页按钮复用同款探测逻辑，两种部署结构下都能跳对
  if (back || shopBtn) {
    var here2 = window.location.pathname || '';
    var dir2 = '';
    if (here2.indexOf('/万能资源圈/') !== -1) dir2 = here2.substring(0, here2.lastIndexOf('/'));
    function probe(el, suffixes) {
      if (!el) return;
      var candidates = suffixes.map(function (sf) { return dir2 ? dir2 + sf : sf; });
      (function tryNext(i) {
        if (i >= candidates.length) { el.href = candidates[0]; return; }
        fetch(candidates[i], { method: 'GET' }).then(function (r) {
          if (r && r.ok) { el.href = candidates[i]; }
          else { tryNext(i + 1); }
        }).catch(function () { tryNext(i + 1); });
      })(0);
    }
    probe(back, ['/index', '/万能资源圈/index']);
    probe(shopBtn, ['/shop', '/万能资源圈/shop']);
  }
})();

(function(){

  document.addEventListener('touchend',function(){if(!pulling)return;pulling=false;var pill=tip.firstElementChild;pill.style.transition='';if(dist>TH){tip.querySelector('.prt-label').textContent='正在刷新…';pill.style.transform='translateY(0px)';/* R170：停在 80px 位显示正在刷新 */setTimeout(function(){location.reload();},400);}else{pill.style.transform='translateY(-48px)';pill.style.opacity='0';/* R170：取消时完整滑回上方淡出 */}dist=0;},{passive:true});
})();

    setTimeout(function () {
      if (!window.__uiCommonLoaded) warn('公共脚本 assets/ui-common.js 未部署成功：请把整个“万能资源圈”文件夹完整重新上传（含 assets、functions、sw.js、config.js）');
      var ok = false; for (var i = 0; i < document.styleSheets.length; i++) { var s = document.styleSheets[i]; try { if (s.href && /ui-common\.css/.test(s.href) && s.cssRules && s.cssRules.length) ok = true; } catch (e) { if (s.href && /ui-common\.css/.test(s.href)) ok = true; } }
      if (!ok) warn('公共样式 assets/ui-common.css 未部署成功：请完整重新上传项目（含 assets 文件夹）');
    }, 800);
  });
})();
</script>
<script>
// R243 条19②：Ctrl+K 命令面板扩展到错误页（全部页面可呼出；入口仅键盘，零新增图标/按键）。
// 命令 = 资源直达：懒取 /api/products，搜到资源回车跳 shop?pid= 打开详情（接口不可达时面板空列表，不影响页面）。
(function () {
  if (!window.__cpPanel) return;
  var products = null;
  function load() {
    if (products !== null) return;
    products = [];
    try {
      fetch('/api/products').then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
        if (d && Array.isArray(d.products)) {
          products = d.products.filter(function (p) {
            return (p.is_online === true || p.is_online === 1) && p.is_hidden !== true && p.is_hidden !== 1;
          });
        }
      }).catch(function () {});
    } catch (e) {}
  }
  window.__cpPanel({
    placeholder: '搜索资源名，回车直达详情…',
    cmds: function () {
      load();
      return products.map(function (p) {
        return { lab: String(p.title || '(无标题)'), tag: '资源', kw: String(p.title || ''), run: function () { if (window.jumpTo) window.jumpTo('shop?pid=' + Number(p.id)); } };
      });
    }
  });
})();
</script>
</body>
</html>
