<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万能资源圈・错误</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;}
body{background:linear-gradient(180deg,#1E88E5 0%,#64B5F6 48%,#BBDEFB 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{text-align:center;color:#fff;max-width:400px;}
.code{font-size:80px;font-weight:700;opacity:0.9;margin-bottom:10px;}
.title{font-size:24px;font-weight:600;margin-bottom:12px;}
.desc{font-size:15px;opacity:0.85;margin-bottom:30px;line-height:1.6;}
.btn{display:inline-block;padding:12px 32px;background:#fff;color:#1E88E5;border-radius:25px;text-decoration:none;font-size:16px;font-weight:600;transition:all 0.2s;}
.btn:hover{transform:scale(1.05);box-shadow:0 4px 15px rgba(0,0,0,0.2);}
.logo{width:100px;height:100px;border-radius:50%;margin:0 auto 20px;overflow:hidden;background:rgba(255,255,255,0.2);}
.logo img{width:100%;height:100%;object-fit:cover;}
html,body{overscroll-behavior:none;}
.prt{position:fixed;top:0;left:0;right:0;height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;z-index:99;transition:height .2s ease;pointer-events:none;}
.prt.show{height:46px;}
.prt span{font-size:12px;color:#fff;background:rgba(30,136,229,.92);border-radius:20px;padding:6px 16px;display:flex;align-items:center;gap:6px;}
.prt i{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.6);border-top-color:#fff;border-radius:50%;animation:prtspin .8s linear infinite;}
@keyframes prtspin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><img id="errLogo" alt="万能资源圈"></div>
  <div class="code" id="errorCode">错误</div>
  <div class="title" id="errorTitle">页面访问异常</div>
  <div class="desc" id="errorDesc">抱歉！您访问的页面出现了问题<br>可能是：①地址有误②页面已删除③服务暂不可用<br>请点击【返回导航】继续浏览</div>
  <a href="index" class="btn" id="errBack">返回导航</a>
</div>
<script>
// 根据URL参数显示不同的错误信息
var params = new URLSearchParams(window.location.search);
var code = params.get('code') || '';
var errorMap = {
  '400': { title: '请求错误', desc: '你的请求格式不正确，请检查后重试' },
  '401': { title: '未授权访问', desc: '你没有权限访问此页面，请先登录' },
  '403': { title: '禁止访问', desc: '服务器拒绝了你的访问请求' },
  '404': { title: '页面不存在', desc: '抱歉！您访问的页面出现了问题<br>可能是：①地址有误②页面已删除③服务暂不可用<br>请点击【返回导航】继续浏览' },
  '500': { title: '服务器错误', desc: '服务器内部出现错误，请稍后重试' },
  '502': { title: '网关错误', desc: '服务器暂时不可用，请稍后重试' },
  '503': { title: '服务不可用', desc: '服务器正在维护中，请稍后重试' }
};
if (code && errorMap[code]) {
  var info = errorMap[code];
  document.getElementById('errorCode').textContent = code;
  document.getElementById('errorTitle').textContent = info.title;
  document.getElementById('errorDesc').innerHTML = info.desc;
}
// 智能识别部署根：本站页面部署在「万能资源圈」子目录下，错误页可能从任意路径（含根级 /xxx）进入，
// 因此返回导航按钮与 logo 需根据当前路径自动计算正确地址，保证任何情况都能跳回导航页。
(function () {
  var logo = document.getElementById('errLogo');
  if (logo) {
    logo.src = 'assets/images/logo.png'; // 相对路径，加载失败自动显示感叹号占位
    logo.onerror = function () { // 加载失败显示统一感叹号占位
      this.onerror = null;
      this.src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"%3E%3Crect width="24" height="24" fill="%23f5f5f5"/%3E%3Cpath fill="%23c3ccd6" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/%3E%3C/svg%3E';
      this.style.objectFit = 'contain';
      this.style.display = 'block';
    };
  }
  var back = document.getElementById('errBack');
  // 返回导航：探测候选导航页，取第一个能访问的（兼容根部署与子目录部署两种结构）
  if (back) {
    var here2 = window.location.pathname || '';
    var candidates = [];
    if (here2.indexOf('/万能资源圈/') !== -1) {
      var dir = here2.substring(0, here2.lastIndexOf('/'));
      candidates.push(dir + '/index', '/万能资源圈/index');
    } else {
      candidates.push('/index', '/万能资源圈/index');
    }
    (function tryNext(i) {
      if (i >= candidates.length) { back.href = candidates[0]; return; }
      fetch(candidates[i], { method: 'GET' }).then(function (r) {
        if (r && r.ok) { back.href = candidates[i]; }
        else { tryNext(i + 1); }
      }).catch(function () { tryNext(i + 1); });
    })(0);
  }
})();
// 下拉刷新（与其它三页统一，静默刷新，不阻塞操作）
(function(){
  var tip=document.createElement('div');tip.className='prt';
  tip.innerHTML='<span><i></i><b class="prt-l">下拉刷新</b></span>';document.body.appendChild(tip);
  var sy=0,sx=0,pulling=false,dist=0,TH=60;
  document.addEventListener('touchstart',function(e){if((window.scrollY||0)<=0){sy=e.touches[0].clientY;sx=e.touches[0].clientX;pulling=true;dist=0;}},{passive:true});
  document.addEventListener('touchmove',function(e){if(!pulling)return;var dy=e.touches[0].clientY-sy,dx=e.touches[0].clientX-sx;if(dy>0&&Math.abs(dy)>Math.abs(dx)){dist=Math.min(dy*.5,80);tip.style.height=dist+'px';tip.classList.add('show');tip.querySelector('.prt-l').textContent=dist>TH?'释放立即刷新':'下拉刷新';}},{passive:true});
  document.addEventListener('touchend',function(){if(!pulling)return;pulling=false;if(dist>TH){tip.querySelector('.prt-l').textContent='正在刷新...';setTimeout(function(){location.reload();},400);}else{tip.classList.remove('show');tip.style.height='0';}dist=0;},{passive:true});
})();
</script>
</body>
</html>
